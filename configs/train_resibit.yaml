# ResiBit-YOLO Training Configuration: ResiBit Architecture
# Reference: ResiBit-YOLO [K-Dense Web, 2026]

model:
  backbone: resibit_backbone
  in_channels: 3
  base_channels: 32
  num_blocks: 4
  num_classes: 80
  scs_ratio: 0.5

training:
  epochs: 300
  batch_size: 16
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.01
  warmup_epochs: 10
  precision_funnel:
    start_epoch: 50
    end_epoch: 250
    min_scale: 0.0
    schedule: cosine

loss:
  detection_weight: 1.0
  spectral_ortho_weight: 0.1

monitoring:
  gradient_threshold: 50.0
  gradient_divergence_threshold: 100.0
  weight_collapse_threshold: 0.5
  log_interval: 100  # steps between monitoring checks

data:
  dataset: coco2017
  train_split: train
  val_split: val
  image_size: 640
